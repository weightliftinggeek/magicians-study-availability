name: Diagnose 403

# Runs the same checks as diag4.py but FROM a GitHub Actions runner, so we
# can see the runner's egress IP and whether the block is source-dependent.
# Trigger manually: Actions -> Diagnose 403 -> Run workflow.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Show runner egress IP and test header combinations
        run: python diag4.py
