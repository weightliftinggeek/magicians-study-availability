name: Update availability

on:
  schedule:
    # Access pattern agreed with FriendlySky:
    #   next 14 days -> hourly        (~408 requests/day)
    #   everything   -> once daily    (~196 requests/day)
    - cron: "20 * * * *"      # hourly, near tier
    - cron: "40 9 * * *"      # daily full sweep (09:40 UTC = ~02:40 Las Vegas)
  workflow_dispatch:
    inputs:
      hide:
        description: "Hide a show (e.g. 2026-11-06 19:00, or 2026-11-06 for the whole day). Leave blank to skip."
        required: false
        default: ""
      unhide:
        description: "Put a hidden show back on the calendar. Same format. Leave blank to skip."
        required: false
        default: ""
      tier:
        description: "How much to refresh"
        required: true
        default: full
        type: choice
        options: [full, near]

concurrency:
  group: availability          # never let two runs overlap the storefront
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      # ---- Gary can hide/unhide a show straight from the Run workflow form ----
      - name: Apply hide / unhide request
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -e
          HIDE="$(echo '${{ inputs.hide }}' | xargs)"
          UNHIDE="$(echo '${{ inputs.unhide }}' | xargs)"
          touch hidden-shows.txt

          valid() {
            echo "$1" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}( [0-9]{2}:[0-9]{2})?$'
          }

          if [ -n "$HIDE" ]; then
            if ! valid "$HIDE"; then
              echo "::error::'$HIDE' isn't a valid entry. Use 2026-11-06 19:00 or 2026-11-06 (24-hour time)."
              exit 1
            fi
            if grep -Fxq "$HIDE" hidden-shows.txt; then
              echo "Already hidden: $HIDE"
            else
              echo "$HIDE" >> hidden-shows.txt
              echo "Hidden: $HIDE"
            fi
          fi

          if [ -n "$UNHIDE" ]; then
            if ! valid "$UNHIDE"; then
              echo "::error::'$UNHIDE' isn't a valid entry. Use 2026-11-06 19:00 or 2026-11-06 (24-hour time)."
              exit 1
            fi
            if grep -Fxq "$UNHIDE" hidden-shows.txt; then
              grep -Fxv "$UNHIDE" hidden-shows.txt > .tmp && mv .tmp hidden-shows.txt
              echo "Un-hidden: $UNHIDE"
            else
              echo "::warning::'$UNHIDE' wasn't in the hidden list; nothing to do."
            fi
          fi

          echo "--- currently hidden ---"
          grep -v '^\s*#' hidden-shows.txt | grep -v '^\s*$' || echo "(none)"

      - name: Decide tier
        id: tier
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tier=${{ inputs.tier }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "40 9 * * *" ]; then
            echo "tier=full" >> $GITHUB_OUTPUT
          else
            echo "tier=near" >> $GITHUB_OUTPUT
          fi

      - name: Scrape availability
        run: python scrape_availability.py ${{ steps.tier.outputs.tier }}

      - name: Commit feed if it changed
        run: |
          git config user.name  "availability-bot"
          git config user.email "bot@users.noreply.github.com"
          git add availability.json pkg_cache.json hidden-shows.txt
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "availability (${{ steps.tier.outputs.tier }}): $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          fi
